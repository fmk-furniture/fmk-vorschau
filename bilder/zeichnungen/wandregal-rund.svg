<text x="28" y="844" font-size="12.5" fill="#14161A">– Tragkraft angeben (Ziel 10–15 kg), Durchbiegung bei 105 cm prüfen (ggf. 3 Träger).</text>
<text x="28" y="862" font-size="12.5" fill="#14161A">– Haken (Option): 3 Stück schwarz, in den Fugen (erste Fuge außen links/rechts + Mitte), 7,5 cm von der Vorderkante.</text>
<text x="28" y="880" font-size="12.5" fill="#14161A">– Viertelstäbe nie zuschneiden: Länge immer 10 cm im Raster; vordere Ecken Kugelecken.</text>
<text x="28" y="898" font-size="12.5" fill="#14161A">– Unterseite gefliest (sichtbar beim Sitzen/Stehen darunter); Verpackung mit Kantenschutz für Paketversand.</text>
