<text x="920" y="816" font-size="20" font-weight="bold" fill="#14161A">FMK Furniture · Taglio 141 · Pflanzkübel</text>
<text x="920" y="852" font-size="12.5" fill="#14161A">Prototyp gebaut · Quarzo matt, rosa Reaktionsharzfuge · Korpus Hartschaum-Trägerplatten, innen abgedichtet</text>
<text x="920" y="872" font-size="12.5" fill="#6B6E70">Maße in cm, Fertigmaße inkl. Fliese · Fliesenraster 10 cm (98,5 mm + ca. 1,5 mm Fuge)</text>
<text x="920" y="892" font-size="12.5" fill="#6B6E70">Alle Außenkanten auf Gehrung · Zeichnung nicht maßstäblich ausdrucken</text>
<text x="920" y="912" font-size="12.5" fill="#6B6E70">Stand: Entwurf 10.11.2026 · erstellt von Claude · prüfen: Florian</text>
<text x="28" y="804" font-size="14" font-weight="bold" fill="#14161A">Hinweise / offene Punkte</text>
<text x="28" y="826" font-size="12.5" fill="#14161A">– Einsatz B (3D-Druck): Außenmaß ca. 28 × 28 × 28, Wandstärke, Material (UV-/frostbeständig?), Griff/Herausnehmen.</text>
<text x="28" y="844" font-size="12.5" fill="#14161A">– Ablauf C: Rohr-Ø, Durchführung durch den Boden mit Dichtmanschette, Höhe der Füße bzw. Schattenfuge.</text>
<text x="28" y="862" font-size="12.5" fill="#14161A">– Einsatz-Rand muss unter der obersten Fliesenreihe verschwinden (Fuge/Spalt zur Fliese?).</text>
<text x="28" y="880" font-size="12.5" fill="#14161A">– Gewicht befüllt ca. 60–70 kg → Hinweis „leer aufstellen, vor Ort befüllen“.</text>
<text x="28" y="898" font-size="12.5" fill="#14161A">– Innen/außen: Frostsicherheit Korpus + Abdichtung; Bodenschutz bei innen (Untersetzer?).</text>
