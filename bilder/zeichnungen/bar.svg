<text x="920" y="816" font-size="20" font-weight="bold" fill="#14161A">FMK Furniture · Taglio 121 · Kaffeebar</text>
<text x="920" y="852" font-size="12.5" fill="#14161A">Prototyp gebaut · Salvia matt, Fuge hell · Korpus Holz (Schreiner) · Version 2</text>
<text x="920" y="872" font-size="12.5" fill="#6B6E70">Maße in cm, Fertigmaße inkl. Fliese · Fliesenraster 10 cm (98,5 mm + ca. 1,5 mm Fuge)</text>
<text x="920" y="892" font-size="12.5" fill="#6B6E70">Alle Außenkanten auf Gehrung · Zeichnung nicht maßstäblich ausdrucken</text>
<text x="920" y="912" font-size="12.5" fill="#6B6E70">Stand: Entwurf 10.11.2026 · erstellt von Claude · prüfen: Florian</text>
<text x="28" y="804" font-size="14" font-weight="bold" fill="#14161A">Hinweise / offene Punkte</text>
<text x="28" y="826" font-size="12.5" fill="#14161A">– Korpus-Rohmaße Schreiner (mm): 886 × 586 × 900; Deckel 86, Ablage 216, Unterteil 598; Ablage 300 tief, Block 286.</text>
<text x="28" y="844" font-size="12.5" fill="#14161A">– Aufbau Fliese + Kleber rechnerisch ca. 7 mm je Seite. LED-Nut im Prototyp entfällt künftig.</text>
<text x="28" y="862" font-size="12.5" fill="#14161A">– Holzkorpus: Holz arbeitet → Risiko für Fugenrisse. Alternative Hartschaum/Kombination prüfen.</text>
<text x="28" y="880" font-size="12.5" fill="#14161A">– Statik Deckel: 30 cm freie Auskragung, Unterseite gefliest. Verstärkung/Verankerung im hinteren Block festlegen.</text>
<text x="28" y="898" font-size="12.5" fill="#14161A">– Wandstärken Korpus und Rückseite (gefliest oder Wandseite ungefliest?) festlegen.</text>
<text x="28" y="916" font-size="12.5" fill="#14161A">– Echte Bauzeit, Materialkosten, Gewicht (ca. 51 kg nur Fliesen) erfassen.</text>
