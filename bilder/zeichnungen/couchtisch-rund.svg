<text x="28" y="804" font-size="14" font-weight="bold" fill="#14161A">Hinweise / offene Punkte</text>
<text x="28" y="826" font-size="12.5" fill="#14161A">– Schublade: 3 Fliesen breit (Spalte 2–4 von links), oberste Fliesenreihe; Front = Fliesen im Raster, Spalt = Fugenbreite.</text>
<text x="28" y="844" font-size="12.5" fill="#14161A">– Pflanzfeld 30 × 20, 1 Fliese von rechts und hinten, Öffnung ohne Rundkante (Florian), innen oberste Reihe gefliest.</text>
<text x="28" y="862" font-size="12.5" fill="#14161A">– Schublade links und Pflanzfeld rechts gleichzeitig möglich; Überlauf/Wasser im Pflanzfeld klären.</text>
<text x="28" y="880" font-size="12.5" fill="#14161A">– Unterseite ungefliest, abgedichtet; 4 Füße Ø 3 × 1 cm, 3,5 cm vom Rand (Schattenfuge).</text>
<text x="28" y="898" font-size="12.5" fill="#14161A">– Kern Hartschaum mit gerundeten Kanten (Lehre); Formstücke in allen Lagerfarben anfragen.</text>
