<text x="28" y="804" font-size="14" font-weight="bold" fill="#14161A">Hinweise / offene Punkte</text>
<text x="28" y="826" font-size="12.5" fill="#14161A">– Schublade: 4 Fliesen breit (Spalte 3–6 von links), oberste Reihe; Front = Fliesen im Raster, Spalt = Fugenbreite ohne Fuge.</text>
<text x="28" y="844" font-size="12.5" fill="#14161A">– Spaltmaß für Push-to-Open prüfen (1,5 mm vs. 2–3 mm), Vollauszug 450, Gehäuse Multiplex 15 mm eingebaut.</text>
<text x="28" y="862" font-size="12.5" fill="#14161A">– Pflanzfeld 30 × 20, 1 Fliese von rechts und hinten, 20 cm tief, innen oberste Reihe gefliest, Einsatz (3D-Druck) herausnehmbar.</text>
<text x="28" y="880" font-size="12.5" fill="#14161A">– Schublade und Pflanzfeld gleichzeitig möglich (keine Überschneidung). Überlauf/Wasser im Pflanzfeld klären.</text>
<text x="28" y="898" font-size="12.5" fill="#14161A">– Höhe 41 cm: Korpus 40 cm auf 4 Füßen Ø 3 cm × 1 cm, 6 cm eingerückt (Schattenfuge) – Florian 12.11.2026.</text>
