<text x="920" y="816" font-size="20" font-weight="bold" fill="#14161A">FMK Furniture · FMK Bancone 180 · Empfangstresen</text>
<text x="920" y="852" font-size="12.5" fill="#14161A">Prototyp im Bau (Praxis) · hohes Portal: Wangen + Deckel gefliest, Front Glasbausteine 19 × 19 × 8</text>
<text x="920" y="872" font-size="12.5" fill="#6B6E70">Maße in cm, Fertigmaße inkl. Fliese · Fliesenraster 10 cm (98,5 mm + ca. 1,5 mm Fuge)</text>
<text x="920" y="892" font-size="12.5" fill="#6B6E70">Alle Außenkanten auf Gehrung · Zeichnung nicht maßstäblich ausdrucken</text>
<text x="920" y="912" font-size="12.5" fill="#6B6E70">Stand: 12.11.2026 (Portal, 8 × 5 Steine) · erstellt von Claude · prüfen: Florian</text>
<text x="28" y="804" font-size="14" font-weight="bold" fill="#14161A">Hinweise / offene Punkte</text>
<text x="28" y="826" font-size="12.5" fill="#14161A">– Aufbau wie ein hohes Portal: 2 Seitenwangen 10 × 70 × 100 und Deckel 180 × 70 × 10 (Fliesenmaß), alle Außenkanten auf Gehrung.</text>
<text x="28" y="844" font-size="12.5" fill="#14161A">– Front: 8 × 5 = 40 Glasbausteine 19 × 19 × 8 im 20-cm-Raster zwischen den Wangen, bis zum Boden (bestätigt Florian 12.11.2026).</text>
<text x="28" y="862" font-size="12.5" fill="#14161A">– Glasbaustein-System (z. B. Montagesystem), Verankerung in Wangen/Deckel, Fugenbreite Glas 1 cm vs. Fliesenfuge.</text>
<text x="28" y="880" font-size="12.5" fill="#14161A">– Rückseite offen (Arbeitsplatz); Deckel-Unterseite gefliest; Stabilität ohne Rückwand prüfen.</text>
<text x="28" y="898" font-size="12.5" fill="#14161A">– Gewicht Glas ca. 2,5 kg/Stein → ca. 100 kg Front + Fliesen + Korpus → Montage vor Ort.</text>
</svg>