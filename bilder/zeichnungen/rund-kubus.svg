<text x="920" y="912" font-size="12.5" fill="#6B6E70">Stand: 12.11.2026 · erstellt von Claude · prüfen: Florian</text>
<text x="28" y="804" font-size="14" font-weight="bold" fill="#14161A">Hinweise / offene Punkte</text>
<text x="28" y="826" font-size="12.5" fill="#14161A">– Viertelstäbe nie zuschneiden: je Kante n × 10 cm, Fugen laufen im Raster der Seitenflächen über die Kante. Schnitt: Viertelstab R 2,5 / 6,8 mm.</text>
<text x="28" y="844" font-size="12.5" fill="#14161A">– Kern: Hartschaum-Würfel mit gerundeten/ausgesparten Kanten, damit Viertelstab und Kugelecke satt aufliegen (Lehre bauen).</text>
<text x="28" y="862" font-size="12.5" fill="#14161A">– Unterseite ungefliest, abgedichtet; 4 Füße Ø 3 × 1 cm, 3,5 cm vom Rand (Schattenfuge).</text>
<text x="28" y="880" font-size="12.5" fill="#14161A">– Rund-Kubus 45 als Hocker: Tragfähigkeit prüfen, ggf. Innenaussteifung; Filzauflage liegt auf der Fliesenfläche.</text>
<text x="28" y="898" font-size="12.5" fill="#14161A">– Formstücke (Viertelstab, Kugelecke) in allen Lagerfarben verfügbar? Preis je Stück anfragen.</text>
