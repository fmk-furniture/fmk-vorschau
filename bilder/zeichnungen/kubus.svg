<text x="920" y="816" font-size="20" font-weight="bold" fill="#14161A">FMK Furniture · Taglio 101 / 102 · Kubus 30 / 40</text>
<text x="920" y="852" font-size="12.5" fill="#14161A">Prototyp 30 gebaut · Nero matt, Fuge weiß · Korpus Hartschaum-Trägerplatten · Größe 40 Entwurf</text>
<text x="920" y="872" font-size="12.5" fill="#6B6E70">Maße in cm, Fertigmaße inkl. Fliese · Fliesenraster 10 cm (98,5 mm + ca. 1,5 mm Fuge)</text>
<text x="920" y="892" font-size="12.5" fill="#6B6E70">Alle Außenkanten auf Gehrung · Zeichnung nicht maßstäblich ausdrucken</text>
<text x="920" y="912" font-size="12.5" fill="#6B6E70">Stand: 12.11.2026 (Größe 40, Filzauflage) · erstellt von Claude · prüfen: Florian</text>
<text x="28" y="804" font-size="14" font-weight="bold" fill="#14161A">Hinweise / offene Punkte</text>
<text x="28" y="826" font-size="12.5" fill="#14161A">– Kubus 30: 45 Fliesen (5 Seiten à 9), Kubus 40: 80 Fliesen (5 Seiten à 16); Boden offen oder geschlossen?</text>
<text x="28" y="844" font-size="12.5" fill="#14161A">– Kubus 40 als Hocker: Tragfähigkeit (Last mittig/am Rand) prüfen, ggf. Innenaussteifung/Zwischenboden.</text>
<text x="28" y="862" font-size="12.5" fill="#14161A">– Filzauflage Option: Wollfilz 5 mm, Zuschnitt 28 × 28 bzw. 38 × 38, Unterseite rutschfest; Lieferant und Farbe offen.</text>
<text x="28" y="880" font-size="12.5" fill="#14161A">– Bodenschutz: Filzgleiter/Fuß, damit die Fliesenkante den Boden nicht verkratzt.</text>
<text x="28" y="898" font-size="12.5" fill="#14161A">– Serienbau: Schablone für Gehrungsschnitte, mehrere Korpusse gleichzeitig; Versand Paket (40er Gewicht prüfen).</text>
